version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: contratoclaro_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contratoclaro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contratoclaro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contratoclaro_backend
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: contratoclaro
      RAG_ENABLED: ${RAG_ENABLED:-false}
      EMBEDDING_CACHE_DIR: /app/storage/models
      DATABASE_URL: postgresql://postgres:password@db:5432/contratoclaro
      JWT_SECRET: dev-secret-change-in-prod
      CORS_ORIGIN: http://localhost
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - embedding-models:/app/storage/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contratoclaro_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  embedding-models:
