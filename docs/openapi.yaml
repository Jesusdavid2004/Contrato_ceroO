openapi: 3.1.0
info:
  title: ContratoClaro API
  version: 1.0.0
  description: >
    Authenticated API for contract analysis and objection letters. Responses
    contain informational analysis, not legal advice.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: API through the same-origin ingress
tags:
  - name: Authentication
    description: User registration and session management
  - name: Contracts
    description: Contract uploads, analysis results, and objection letters
  - name: Realtime
    description: Single-use tickets for the analysis progress WebSocket (see docs/websocket-protocol.md)
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      security: []
      summary: Register a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; refresh token is set in an httpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      security: []
      summary: Authenticate and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; refresh token is set in an httpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security:
        - refreshCookie: []
      summary: Rotate session tokens
      description: Reads the refresh cookie; a request-body refreshToken is retained for compatibility.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Tokens refreshed and refresh cookie rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutSession
      security: []
      summary: Clear refresh session cookie
      responses:
        "200":
          description: Session cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      summary: Get the current user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Authentication]
      operationId: deleteCurrentUser
      security:
        - bearerAuth: []
      summary: Permanently delete the current account and owned data
      responses:
        "200":
          description: Account deletion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      security:
        - bearerAuth: []
      summary: List the current user's contracts
      responses:
        "200":
          description: Contract summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Contracts]
      operationId: uploadContract
      security:
        - bearerAuth: []
      summary: Upload a contract and enqueue analysis
      description: Accepts documents in PDF, PNG, JPEG, WebP, TIFF, BMP, or GIF format up to 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contract]
              properties:
                contract:
                  type: string
                  format: binary
                  description: File payload (PDF, PNG, JPEG, WEBP, TIFF, BMP, GIF).
                title:
                  type: string
                contract_type:
                  $ref: "#/components/schemas/ContractType"
                jurisdiction:
                  type: string
                  example: CO
                locale:
                  type: string
                  enum: [en, es]
      responses:
        "201":
          description: Contract accepted for asynchronous analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contracts/{id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: getContract
      security:
        - bearerAuth: []
      summary: Get a contract and its analyzed clauses
      responses:
        "200":
          description: Contract result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Contracts]
      operationId: deleteContract
      security:
        - bearerAuth: []
      summary: Delete an owned contract
      responses:
        "200":
          description: Contract deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /contracts/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: getContractStatus
      security:
        - bearerAuth: []
      summary: Poll asynchronous analysis status
      responses:
        "200":
          description: Current processing state
          content:
            application/json:
              schema:
                type: object
                required: [id, status, failure_message_key]
                properties:
                  id:
                    type: string
                  status:
                    $ref: "#/components/schemas/ContractStatus"
                  failure_message_key:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /realtime/ticket:
    post:
      tags: [Realtime]
      operationId: createRealtimeTicket
      security:
        - bearerAuth: []
      summary: Issue a single-use ticket for the progress WebSocket
      description: >
        Returns a random single-use ticket (TTL 60 s) bound to the caller.
        Connect to /api/realtime?ticket=<ticket>. Access tokens must never be
        placed in the WebSocket URL. See docs/websocket-protocol.md.
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket:
                    type: string
                    description: Opaque single-use ticket for the WS upgrade
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contracts/{id}/facts:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    put:
      tags: [Contracts]
      operationId: confirmContractFact
      security:
        - bearerAuth: []
      summary: Confirm or correct an extracted fact before use
      description: >
        found/unconfirmed facts can be confirmed (no value) or corrected
        (value required); not_found only corrected; confirmed only corrected.
        Requires READY analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, status]
              properties:
                key:
                  type: string
                  enum: [party_a, party_b, amount, currency, periodicity, duration, start_date, end_date, termination]
                status:
                  type: string
                  enum: [confirmed, corrected]
                value:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contract not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/clauses/{clauseId}/proposals:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: clauseId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Contracts]
      operationId: createClauseProposal
      security:
        - bearerAuth: []
      summary: Propose an adjustment to a clause as a draft
      description: Defaults the proposal to the clause suggested change; reason is required; requires READY analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                proposed_text:
                  type: string
                  maxLength: 2000
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Proposal draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contract not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/proposals:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: listClauseProposals
      security:
        - bearerAuth: []
      summary: List own clause proposals
      responses:
        "200":
          description: Proposals of the contract
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /contracts/proposals/{proposalId}:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Contracts]
      operationId: updateClauseProposal
      security:
        - bearerAuth: []
      summary: Edit a draft, accept it for the draft, or discard it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [accept, discard]
                proposed_text:
                  type: string
                  maxLength: 2000
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal no longer editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/compare:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: other_id
        in: query
        required: true
        schema:
          type: string
    get:
      tags: [Contracts]
      operationId: compareContracts
      security:
        - bearerAuth: []
      summary: Deterministic diff between two own READY contracts
      description: >
        Aligns clauses by similarity and reports added, removed and modified
        (with word diff) plus reading limitations. Never legal equivalence,
        never cross-user data.
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                required: [base_contract_id, other_contract_id, added, removed, modified, unchanged, truncated, limitations]
                properties:
                  base_contract_id:
                    type: string
                  other_contract_id:
                    type: string
                  added:
                    type: array
                    items:
                      type: object
                  removed:
                    type: array
                    items:
                      type: object
                  modified:
                    type: array
                    items:
                      type: object
                  unchanged:
                    type: integer
                  truncated:
                    type: boolean
                  limitations:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contract not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/questions:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      operationId: askContractQuestion
      security:
        - bearerAuth: []
      summary: Restricted Q&A over own READY analysis
      description: >
        Retrieval over stored clauses and facts with verifiable citations;
        no generative model, no tools, no persistence. Answers "not found"
        without evidence. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Answer with citations or not-found
          content:
            application/json:
              schema:
                type: object
                required: [found, answer, citations, limits]
                properties:
                  found:
                    type: boolean
                  answer:
                    type: string
                  citations:
                    type: array
                    items:
                      type: object
                  limits:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contract not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /contracts/{id}/reminders:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: listReminders
      security:
        - bearerAuth: []
      summary: List own reminders
      responses:
        "200":
          description: Reminders of the contract
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Contracts]
      operationId: createReminder
      security:
        - bearerAuth: []
      summary: Create an internal reminder (idempotent)
      description: Requires future due_at with offset and IANA timezone; duplicate pending returns 200 with the existing one. No external email or channels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, due_at, timezone]
              properties:
                title:
                  type: string
                  maxLength: 200
                due_at:
                  type: string
                  format: date-time
                timezone:
                  type: string
      responses:
        "201":
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "200":
          description: Duplicate pending reminder returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/reminders/{reminderId}:
    parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Contracts]
      operationId: completeReminder
      security:
        - bearerAuth: []
      summary: Complete a reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done]
      responses:
        "200":
          description: Completed reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/reminders.ics:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: downloadRemindersIcs
      security:
        - bearerAuth: []
      summary: Download reminders as .ics (no external accounts)
      responses:
        "200":
          description: Calendar file with explicit timezones
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /contracts/{id}/report.pdf:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: downloadCaseReport
      security:
        - bearerAuth: []
      summary: Download the case file with findings and warnings
      description: Context, summary, flagged fragments, confirmed facts, proposals, letter, sources, coverage and warnings. Nothing is sent anywhere.
      responses:
        "200":
          description: Case file PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /contracts/{id}/review-request:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: getReviewRequest
      security:
        - bearerAuth: []
      summary: Latest human review status
      responses:
        "200":
          description: Latest review request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Contracts]
      operationId: requestReview
      security:
        - bearerAuth: []
      summary: Prepare a human review file (idempotent)
      description: Shows pending until a reviewer exists; no expert review is simulated and nobody is contacted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Review requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"
        "200":
          description: Open request returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/review-requests/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Contracts]
      operationId: updateReviewRequest
      security:
        - bearerAuth: []
      summary: Move a review forward (owner only for now)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [in_review, reviewed]
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/letter:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [Contracts]
      operationId: generateObjectionLetter
      security:
        - bearerAuth: []
      summary: Generate and persist an objection letter
      description: >
        Uses only medium/high-risk clauses by default, or an explicit finding
        selection. Prioritizes clarification or adjustment requests; nothing is
        sent automatically. Returns 422 without an AI call if none are flagged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clause_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Explicit finding selection; defaults to all flagged clauses.
                recipient:
                  type: string
                  maxLength: 120
                purpose:
                  type: string
                  enum: [clarification, adjustment, other]
                tone:
                  type: string
                  enum: [respectful, formal, firm]
      responses:
        "201":
          description: Letter generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectionLetter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [Contracts]
      operationId: updateObjectionLetter
      security:
        - bearerAuth: []
      summary: Save edits to the latest objection letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  description: Non-empty text limited to 350 words.
      responses:
        "200":
          description: Edited letter saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectionLetter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{id}/letter/pdf:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Contracts]
      operationId: downloadObjectionLetterPdf
      security:
        - bearerAuth: []
      summary: Download the latest objection letter as a PDF
      responses:
        "200":
          description: Localized PDF attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Backend is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      summary: Readiness probe
      responses:
        "200":
          description: Backend and dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Service unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: cc_refresh_token
  parameters:
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    SessionResponse:
      type: object
      required: [user, accessToken, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
        token:
          type: string
          description: Backwards-compatible alias for accessToken.
    ContractType:
      type: string
      enum: [LEASE, SERVICE, EMPLOYMENT, OTHER]
    ContractStatus:
      type: string
      enum: [UPLOADED, EXTRACTING, ANALYZING, READY, FAILED]
    Contract:
      type: object
      required: [id, user_id, title, file_name, contract_type, jurisdiction, locale, status, global_risk_score, uploaded_at, clauses]
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        file_name:
          type: string
        contract_type:
          $ref: "#/components/schemas/ContractType"
        jurisdiction:
          type: string
        locale:
          type: string
        user_role:
          type: string
          enum: [tenant, consumer, employee, other]
        coverage_status:
          type: string
          enum: [supported, experimental, unsupported]
          description: Analysis coverage for this jurisdiction and type; nothing is supported without recorded legal review.
        coverage_rules_version:
          type: string
        status:
          $ref: "#/components/schemas/ContractStatus"
        global_risk_score:
          type: integer
          minimum: 0
          maximum: 100
        uploaded_at:
          type: string
          format: date-time
        failure_reason:
          type: [string, "null"]
        storage_uri:
          type: [string, "null"]
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/Clause"
        facts:
          type: array
          description: Key facts with evidence; present on detail reads when analysis stored them.
          items:
            $ref: "#/components/schemas/Fact"
    Clause:
      type: object
      required: [id, order_index, original_text, risk_level, confidence, plain_explanation, why_risky, legal_basis, suggested_change]
      properties:
        id:
          type: string
        order_index:
          type: integer
        original_text:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        plain_explanation:
          type: string
        why_risky:
          type: [string, "null"]
        legal_basis:
          type: array
          items:
            type: object
            required: [reference, summary]
            properties:
              reference:
                type: string
              summary:
                type: string
        suggested_change:
          type: [string, "null"]
        page_number:
          type: [integer, "null"]
          description: Source page when reliably known; null otherwise, never invented.
        start_offset:
          type: [integer, "null"]
        end_offset:
          type: [integer, "null"]
        requires_review:
          type: boolean
          description: True when model confidence stays below 0.6 after recheck; independent of risk level.
    Fact:
      type: object
      required: [key, value, status, evidence_clause_id, evidence_quote]
      properties:
        key:
          type: string
          enum: [party_a, party_b, amount, currency, periodicity, duration, start_date, end_date, termination]
        value:
          type: [string, "null"]
        status:
          type: string
          enum: [found, not_found, unconfirmed, confirmed, corrected]
          description: Extracted states plus user-confirmed/corrected; confirm before use in documents.
        evidence_clause_id:
          type: [string, "null"]
        evidence_quote:
          type: [string, "null"]
    Proposal:
      type: object
      required: [id, contract_id, clause_id, original_text, proposed_text, reason, status, version, created_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        clause_id:
          type: string
        original_text:
          type: string
        proposed_text:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [draft, accepted, discarded]
          description: Accepting keeps the proposal in the user draft; it never changes the counterparty contract.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    Reminder:
      type: object
      required: [id, contract_id, user_id, title, due_at, timezone, status, created_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        user_id:
          type: string
        title:
          type: string
        due_at:
          type: string
          format: date-time
          description: Unambiguous instant; naive datetimes are rejected.
        timezone:
          type: string
          example: America/Bogota
        status:
          type: string
          enum: [pending, done]
        created_at:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [id, contract_id, user_id, status, note, created_at, updated_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [pending, in_review, reviewed]
          description: Owner-only transitions while no revocable reviewer role exists.
        note:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ObjectionLetter:
      type: object
      required: [id, contract_id, locale, content, created_at]
      properties:
        id:
          type: string
        contract_id:
          type: string
        locale:
          type: string
        content:
          type: string
        recipient:
          type: [string, "null"]
        purpose:
          type: string
          enum: [clarification, adjustment, other]
        tone:
          type: string
          enum: [respectful, formal, firm]
        selected_clause_ids:
          type: array
          items:
            type: string
          description: Explicit finding selection; empty means the default flagged set at generation time.
        created_at:
          type: string
          format: date-time
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message_key]
      properties:
        code:
          type: string
        message_key:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Resource is owned by another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request or business validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Upload exceeds the 10 MiB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: File type or magic bytes are unsupported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Request limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
