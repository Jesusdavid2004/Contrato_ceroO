<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Understand contract clauses and prepare an informed objection letter." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ContratoClaro</title>
    <script>
      try {
        var t = localStorage.getItem('cc_theme') || localStorage.getItem('theme') || 'system';
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <main>
        <p style="font-family: system-ui, sans-serif; text-align: center; padding: 15vh 1rem; color: #595959;">
          Loading ContratoClaro…
        </p>
      </main>
    </div>
    <noscript>
      <main>
        <p>ContratoClaro needs JavaScript enabled to run.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
